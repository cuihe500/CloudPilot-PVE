schema: spec-driven

context: |
  OpenSpec artifacts are bilingual. English is the normative source used for
  validation, implementation, and acceptance. Chinese is a non-normative
  translation for readers and must not introduce or change requirements.

rules:
  proposal:
    - Write the complete normative artifact in English first.
    - Append a complete Chinese translation under "## 中文翻译（非规范性）".
  design:
    - Write the complete normative artifact in English first.
    - Append a complete Chinese translation under "## 中文翻译（非规范性）".
  specs:
    - Write all OpenSpec operation, requirement, scenario, SHALL/MUST, WHEN, and THEN syntax only in the normative English section.
    - Append a complete Chinese translation under "## 中文翻译（非规范性）" using plain translated labels that cannot be parsed as requirements or scenarios.
  tasks:
    - Write all implementation checkboxes only in the normative English section.
    - Append a complete Chinese translation under "## 中文翻译（非规范性）" without checkbox syntax.
