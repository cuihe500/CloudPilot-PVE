name: 需求
description: 登记需要排期、OpenSpec 和开发交付的新需求
title: "[Requirement]: "
projects: ["cuihe500/5"]
body:
  - type: markdown
    attributes:
      value: |
        Issue 创建后必须设置 Project Priority 和 Iteration，排期完成前不得进入 OpenSpec。
  - type: textarea
    id: goal
    attributes:
      label: 目标与背景
      description: 说明要解决的问题、用户和预期结果。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围
      description: 列出本需求必须交付的行为。
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: 非目标
      description: 明确本次不处理的内容。
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 使用可验证的清单描述完成条件。
      placeholder: |
        - [ ] 场景一
        - [ ] 场景二
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: 初步风险
      options:
        - 低：文案、样式或内部整理
        - 中：普通 API、查询、表单或状态
        - 高：认证、权限、审批、配额、迁移、PVE 或回收
        - 生产操作：部署、真实 PVE、秘密或破坏性操作
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与阻塞
      description: 关联 Issue、外部决策或环境依赖；没有则填写“无”。
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 已搜索现有 Issue，确认没有重复需求。
          required: true
        - label: 内容不包含密码、令牌、私钥或其他秘密。
          required: true
